{% macro treasury(resources) %}
  <details class="treasury-menu">
    <summary title="Tesouro da Guilda"><small>Tesouro</small><strong>{{ resources.gold }}</strong></summary>
    <div class="treasury-popover">
      <h3>Tesouro da Guilda</h3>
      <dl>
        <div><dt>Ouro</dt><dd>{{ resources.gold }}</dd></div>
        <div><dt>Madeira</dt><dd>{{ resources.wood }}</dd></div>
        <div><dt>Minério</dt><dd>{{ resources.ore }}</dd></div>
        <div><dt>Cristais</dt><dd>{{ resources.crystals }}</dd></div>
      </dl>
    </div>
  </details>
{% endmacro %}
