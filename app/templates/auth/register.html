{% extends "base.html" %}

{% block title %}Cadastro - Guild Idle Manager{% endblock %}

{% block content %}
  <section class="auth-panel" aria-labelledby="register-title">
    <p class="eyebrow">Nova conta</p>
    <h1 id="register-title">Criar conta</h1>

    {% if error %}
      <p class="error-message">{{ error }}</p>
    {% endif %}

    <form class="form-stack" method="post" action="/register">
      <label>
        Usuario
        <input type="text" name="username" value="{{ form.username or '' }}" autocomplete="username" required>
      </label>
      <label>
        E-mail opcional
        <input type="email" name="email" value="{{ form.email or '' }}" autocomplete="email">
      </label>
      <label>
        Senha
        <input type="password" name="password" autocomplete="new-password" required>
      </label>
      <label>
        Confirmar senha
        <input type="password" name="confirm_password" autocomplete="new-password" required>
      </label>
      <button type="submit">Criar conta</button>
    </form>

    <p class="form-footer">Ja tem conta? <a href="/login">Entrar</a></p>
  </section>
{% endblock %}
