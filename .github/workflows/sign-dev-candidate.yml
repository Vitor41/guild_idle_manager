name: Sign and verify DEV candidate artifact without publishing

on:
  workflow_run:
    workflows: ["Build DEV candidate without publishing"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  sign-and-verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: windows-2025
    environment: release-signing
    timeout-minutes: 15
    steps:
      - name: Check out trusted signing and verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up exact CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      - name: Install signing verifier dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pip==26.3
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao fixar pip para verificação da assinatura.' }
          python -m pip install --disable-pip-version-check cryptography==49.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar cryptography para verificação da assinatura.' }

      - name: Download the tested unsigned candidate artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gim-dev-candidate-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/gim-dev-candidate-to-sign
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Confirm candidate provenance and version
        id: candidate
        shell: pwsh
        env:
          CANDIDATE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          CANDIDATE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CANDIDATE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'gim-dev-candidate-to-sign'
          $metadataPath = Join-Path $artifact 'candidate-metadata.json'
          $versionPath = Join-Path $artifact 'gim-app-version.txt'
          $setup = Join-Path $artifact 'GuildIdleManager-DEV-Setup.exe'
          $zip = Join-Path $artifact 'GuildIdleManager-DEV.zip'
          $validation = Join-Path $artifact 'candidate-setup-validation.json'
          foreach ($requiredPath in @($metadataPath,$versionPath,$setup,$zip,$validation)) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) { throw "Artifact incompleto: $requiredPath" }
          }
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          $version = (Get-Content -LiteralPath $versionPath -Raw).Trim()
          if ($metadata.repository -ne $env:CANDIDATE_REPOSITORY -or
              $metadata.source_commit_sha -ne $env:CANDIDATE_COMMIT_SHA -or
              $metadata.source_branch -ne $env:CANDIDATE_BRANCH -or
              $metadata.app_version -ne $version -or
              $version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw 'Metadados do artifact não correspondem ao run candidato.'
          }
          $setupHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($setupHash -ne $metadata.setup_sha256 -or $zipHash -ne $metadata.zip_sha256) {
            throw 'O hash do artifact difere dos metadados registrados pelo build.'
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "app-version=$version`n")

      - name: Sign the tested Setup without publishing it
        shell: pwsh
        env:
          RELEASE_PRIVATE_KEY_B64: ${{ secrets.GIM_RELEASE_PRIVATE_KEY_B64 }}
          RELEASE_PUBLIC_KEY_B64: ${{ vars.GIM_RELEASE_PUBLIC_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_PRIVATE_KEY_B64) -or
              [string]::IsNullOrWhiteSpace($env:RELEASE_PUBLIC_KEY_B64)) {
            throw 'Configure as credenciais de assinatura no ambiente release-signing.'
          }
          $artifact = Join-Path $env:RUNNER_TEMP 'gim-dev-candidate-to-sign'
          $keyFile = Join-Path $env:RUNNER_TEMP ("gim-ed25519-candidate-" + [Guid]::NewGuid().ToString('N') + '.b64')
          try {
            [System.IO.File]::WriteAllText($keyFile, $env:RELEASE_PRIVATE_KEY_B64, [System.Text.Encoding]::ASCII)
            python scripts/sign_github_release.py `
              --setup (Join-Path $artifact 'GuildIdleManager-DEV-Setup.exe') `
              --private-key-file $keyFile `
              --version '${{ steps.candidate.outputs.app-version }}' `
              --channel DEV `
              --minimum-supported-version 0.3.1 `
              --expected-public-key-base64 $env:RELEASE_PUBLIC_KEY_B64 `
              --app-version-file (Join-Path $artifact 'gim-app-version.txt') `
              --output-directory $artifact
            if ($LASTEXITCODE -ne 0) { throw 'Assinatura do manifesto do candidato falhou.' }
          }
          finally {
            Remove-Item -LiteralPath $keyFile -Force -ErrorAction SilentlyContinue
          }

      - name: Verify signature, manifest fields, and Setup hash
        shell: pwsh
        env:
          RELEASE_PUBLIC_KEY_B64: ${{ vars.GIM_RELEASE_PUBLIC_KEY_B64 }}
          APP_VERSION: ${{ steps.candidate.outputs.app-version }}
          CANDIDATE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'gim-dev-candidate-to-sign'
          python scripts/verify_signed_release.py `
            --setup (Join-Path $artifact 'GuildIdleManager-DEV-Setup.exe') `
            --manifest (Join-Path $artifact 'gim-release.json') `
            --signature (Join-Path $artifact 'gim-release.json.sig') `
            --public-key-base64 $env:RELEASE_PUBLIC_KEY_B64 `
            --version $env:APP_VERSION `
            --channel DEV `
            --minimum-supported-version 0.3.1
          if ($LASTEXITCODE -ne 0) { throw 'A assinatura ou os hashes do candidato não conferem.' }
          $evidence = [ordered]@{
            schema_version = 1
            source_commit_sha = $env:CANDIDATE_COMMIT_SHA
            version = $env:APP_VERSION
            setup_sha256 = (Get-FileHash -LiteralPath (Join-Path $artifact 'GuildIdleManager-DEV-Setup.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
            signature_verified = $true
            github_release_created = $false
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $artifact 'candidate-signature-validation.json'),
            ($evidence | ConvertTo-Json -Depth 3),
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload signed candidate artifact for three days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gim-dev-candidate-signed-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/gim-dev-candidate-to-sign/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
